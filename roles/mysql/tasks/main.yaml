  - name: enabling mysql:8.4 module
    command: dnf module enable mysql:8.4 -y

  - name: installation of mysql
    package:
      name: mysql-server
      state: present

  - name: start and enable the service
    service: 
      name: mysqld
      state: started
      enabled: yes

  - name: Install boto3 and botocore via pip
    ansible.builtin.pip:
      name:
        - boto3
        - botocore
      state: present
      executable: pip3.9

  - name: setting mysql root password
    command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"
